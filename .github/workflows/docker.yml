name: Docker

# Pull requests: amd64 image + smoke test, only when something the image depends on
# changed. Releases (tags v*) and manual runs: amd64 + arm64, then publish to ghcr.io.
# Coolify builds from the Git repository and does not need the published image.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'apps/server/src/config.ts'
      - 'apps/server/src/index.ts'
      - 'apps/server/src/cli.ts'
      - 'apps/server/drizzle/**'
      - 'scripts/docker-smoke.sh'
      - '.github/workflows/docker.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Build & smoke test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # arm64 is emulated (QEMU) and slow: only for releases and manual runs.
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: personengedaechtnis:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: scripts/docker-smoke.sh personengedaechtnis:test
        env:
          SMOKE_TIMEOUT: ${{ matrix.arch == 'amd64' && '60' || '180' }}

  publish:
    name: Publish (amd64 + arm64)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Manual run on main → edge; release tag v1.2.3 → 1.2.3, 1.2 and latest.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuses the layers of the test builds.
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
